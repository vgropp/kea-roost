name: snapshot

# Every green commit on main becomes the snapshot image and renews the draft release.
on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  version:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.next.outputs.version }}
      short: ${{ steps.next.outputs.short }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - id: next
        run: |
          echo "version=$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      version: ${{ needs.version.outputs.next || 'snapshot' }}-snapshot.${{ needs.version.outputs.short }}
      tags: type=raw,value=snapshot

  draft:
    needs: [version, image]
    if: needs.version.outputs.next != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Renew the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEXT: ${{ needs.version.outputs.next }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            printf '```\ndocker pull ghcr.io/%s:%s\n```\n\n' "$GH_REPO" "${NEXT#v}"
            GITHUB_REPOSITORY="$GH_REPO" .github/scripts/release-notes.sh "$NEXT"
          } > notes.md
          # The draft is updated in place, so that a failure cannot lose it. A draft has
          # no tag yet and is only found by its id.
          drafts=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft) | .id')
          first=$(printf '%s\n' "$drafts" | head -n 1)
          if [ -z "$first" ]; then
            gh release create "$NEXT" --draft --target "$SHA" --title "$NEXT" --notes-file notes.md
            exit 0
          fi
          gh api --method PATCH "repos/$GH_REPO/releases/$first" -f tag_name="$NEXT" \
            -f target_commitish="$SHA" -f name="$NEXT" -F body=@notes.md --silent
          for id in $(printf '%s\n' "$drafts" | tail -n +2); do
            gh api --method DELETE "repos/$GH_REPO/releases/$id" --silent
          done
