name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  # The release workflow runs these jobs before it publishes anything.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Debian offers Kea 3.0 through backports, Ubuntu does not
    container: debian:trixie@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
    steps:
      - name: Install Kea and Chromium
        run: |
          echo "deb http://deb.debian.org/debian trixie-backports main" > /etc/apt/sources.list.d/backports.list
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gcc libc6-dev chromium
          apt-get install -y --no-install-recommends -t trixie-backports kea-dhcp4-server

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # The vendor table is not in the repository and its source changes weekly.
      - name: Compute the cache week
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: oui
        with:
          path: internal/oui/oui.tsv.gz
          key: oui-${{ steps.week.outputs.week }}

      - name: Fetch the vendor table
        if: steps.oui.outputs.cache-hit != 'true'
        run: go run ./cmd/oui-update

      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -tags kea ./internal/manager
      - run: go test -tags e2e ./internal/web

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The lint tools need a newer Go than the minimum in go.mod.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable

      - name: Compute the cache week
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: oui
        with:
          path: internal/oui/oui.tsv.gz
          key: oui-${{ steps.week.outputs.week }}

      - name: Fetch the vendor table
        if: steps.oui.outputs.cache-hit != 'true'
        run: go run ./cmd/oui-update

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags e2e,kea ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      - name: Check JavaScript syntax
        run: |
          node --check internal/web/static/app.js
          node --check internal/web/static/theme.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Compute the cache week
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: oui
        with:
          path: internal/oui/oui.tsv.gz
          key: oui-${{ steps.week.outputs.week }}

      - name: Fetch the vendor table
        if: steps.oui.outputs.cache-hit != 'true'
        run: go run ./cmd/oui-update

      - name: Build the image
        run: docker build -t kea-roost .
